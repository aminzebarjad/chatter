<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatter — Obsidian Messenger</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="passwordScreen" class="screen active"><div class="card"><h2>🔐 Chatter</h2><p>ورود به فضای گفتگو</p><input id="roomPassword" type="password" placeholder="رمز اتاق"><button id="checkPasswordBtn">ورود</button><p id="passwordError" class="error-text"></p></div></div>
<div id="tokenScreen" class="screen"><div class="card wide"><h2>🔑 اتصال GitHub</h2><p class="subtitle">برای همگام‌سازی پیام‌ها توکن خود را وارد کنید</p><input id="tokenInput" type="password" placeholder="GitHub Token"><button id="connectBtn">اتصال</button><p id="tokenError" class="error-text"></p></div></div>
<div id="chatScreen" class="screen"><div class="chat-container"><header class="chat-header"><div><strong>🟢 Chatter</strong><small> Private Messenger</small></div><div><span id="currentUser" class="user-badge"></span><button id="logoutBtn">خروج</button></div></header><main id="messages" class="chat-messages"></main><div class="chat-input-area"><button id="emojiBtn">😊</button><button id="voiceBtn">🎤</button><input id="msgInput" type="text" placeholder="پیام خود را بنویسید..."><button id="sendBtn">➤</button></div></div></div>
<div id="emojiPicker" class="emoji-picker hidden"></div><div id="recordingIndicator" class="recording-indicator hidden"></div><div id="changePasswordModal" class="modal"></div><div id="customConfirmModal" class="custom-confirm"></div>
<script src="js/voice.js"></script><script src="js/script.js"></script>
</body></html>
